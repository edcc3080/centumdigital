<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 로그인 | 센텀디지털캠프</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="login-page">
  <form class="login-card" id="loginForm">
    <div class="login-logo">C</div>
    <h1>관리자 로그인</h1>
    <p>공지사항·후기·갤러리 글 작성, 건의함과 수강상담 관리를 위한 관리자 전용 페이지입니다.</p>
    <div class="login-field">
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username" required>
    </div>
    <div class="login-field">
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="a-btn a-primary" style="width:100%;margin-top:6px" type="submit">로그인</button>
    <div id="loginError" class="login-error" hidden></div>
    <div style="margin-top:18px;text-align:center">
      <a href="../index.html" style="color:#64748b;font-size:12px">← 홈페이지로 돌아가기</a>
    </div>
  </form>
</div>
<script type="module" src="login.js"></script>
</body>
</html>
