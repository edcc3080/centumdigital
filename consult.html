<!DOCTYPE html>
<html lang="ko">

<head>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Pretendard,"Noto Sans KR",sans-serif;
background:#f8fafc;
color:#1e293b;
}

a{
text-decoration:none;
color:inherit;
}

ul{
list-style:none;
}

.container{
width:min(950px,calc(100% - 40px));
margin:auto;
}

header{
background:white;
border-bottom:1px solid #e2e8f0;
}

.header-inner{
height:85px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:21px;
font-weight:900;
color:#2563eb;
}

nav ul{
display:flex;
gap:25px;
}

nav a{
font-size:14px;
font-weight:700;
}

.hero{
padding:70px 0;
text-align:center;
background:#1d4ed8;
color:white;
}

.hero h1{
font-size:40px;
}

.hero p{
margin-top:8px;
color:#dbeafe;
}

.content{
padding:70px 0;
}

.form-box{
background:white;
border-radius:18px;
padding:45px;
box-shadow:0 10px 35px rgba(0,0,0,.07);
}

.form-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.form-group{
margin-bottom:22px;
}

label{
display:block;
font-weight:800;
margin-bottom:8px;
}

input,
select,
textarea{
width:100%;
border:1px solid #cbd5e1;
padding:13px;
border-radius:7px;
font-family:inherit;
}

textarea{
height:150px;
resize:vertical;
}

.notice{
background:#eff6ff;
padding:18px;
border-radius:8px;
font-size:13px;
color:#475569;
margin-bottom:25px;
}

.submit{
width:100%;
border:0;
background:#2563eb;
color:white;
padding:15px;
border-radius:8px;
font-size:16px;
font-weight:900;
cursor:pointer;
}

.phone{
text-align:center;
margin-top:35px;
}

.phone strong{
display:block;
font-size:29px;
color:#2563eb;
}

footer{
background:#111827;
color:#94a3b8;
padding:45px 0;
font-size:13px;
}

@media(max-width:800px){

nav{
display:none;
}

.form-row{
grid-template-columns:1fr;
gap:0;
}

.form-box{
padding:25px;
}

}

</style>

</head>
